[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-llm-memory"
dynamic = ["version"]
description = "Slim, fast, persistent memory + retrieval for LLM apps. numpy + httpx, ~1000 LOC, drops into anything."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "trbck"}]
keywords = ["llm", "embeddings", "vector", "memory", "rag", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "httpx>=0.25",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
graph = ["networkx>=3.0"]
rerank = ["sentence-transformers>=3.0"]
anthropic = ["anthropic>=0.40"]
obsidian = ["watchdog>=4", "pyyaml>=6", "mcp>=2"]
mcp = ["mcp>=2"]
test = ["pytest>=7", "pytest-asyncio>=0.23", "tomli>=2; python_version < '3.11'"]
dev = ["slim-llm-memory[test,gemini,graph,anthropic,obsidian,rerank,mcp]", "ruff>=0.6", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/trbck/slim-llm-memory"
Documentation = "https://github.com/trbck/slim-llm-memory/blob/main/docs/IMPLEMENTATION.md"
Changelog = "https://github.com/trbck/slim-llm-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/trbck/slim-llm-memory/issues"

[project.scripts]
# Every entry here must import on a plain install; tests/test_packaging.py checks.
# (An earlier `slim-llm-obsidian` pointed at a module that was never written.)
slim-memory-mcp = "slim_llm_memory.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "slim_llm_memory.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["slim_llm_memory*"]

[tool.setuptools.package-data]
slim_llm_memory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --strict-markers"
asyncio_mode = "auto"
